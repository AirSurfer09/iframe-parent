server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static export emits <route>.html; resolve extensionless URLs to them.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Runtime config is rewritten on every container start — never cache it.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Content-hashed build assets are safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # The page embeds Convai's pixel-stream iframe and needs camera/microphone.
    add_header Permissions-Policy "camera=*, microphone=*, autoplay=*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
